<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Time Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0c0e1a 0%, #1a1025 25%, #0d1b2a 50%, #0f0d1e 75%, #000000 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            position: relative;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 15% 30%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 70%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.08) 0%, transparent 50%);
            animation: backgroundPulse 10s ease-in-out infinite;
        }

        @keyframes backgroundPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .time-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.15em;
            font-size: clamp(5rem, 22vw, 15rem);
            font-weight: 200;
            letter-spacing: -0.02em;
            position: relative;
            z-index: 1;
            animation: fadeIn 1s ease-out;
        }

        .time-container::before {
            content: '';
            position: absolute;
            inset: -80px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, rgba(59, 130, 246, 0.15) 50%, transparent 70%);
            filter: blur(60px);
            animation: glow 5s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes glow {
            0%, 100% { 
                opacity: 0.6; 
                transform: scale(1); 
            }
            50% { 
                opacity: 1; 
                transform: scale(1.15); 
            }
        }

        .digit {
            display: inline-block;
            min-width: 0.65em;
            text-align: center;
            position: relative;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: linear-gradient(135deg, 
                #a78bfa 0%, 
                #8b5cf6 15%, 
                #6366f1 30%, 
                #3b82f6 50%, 
                #0ea5e9 70%, 
                #06b6d4 85%, 
                #14b8a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 300% 300%;
            animation: gradientFlow 8s ease infinite;
            filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.7))
                    drop-shadow(0 0 50px rgba(59, 130, 246, 0.5))
                    drop-shadow(0 0 75px rgba(14, 165, 233, 0.3));
        }

        @keyframes gradientFlow {
            0%, 100% { background-position: 0% 50%; }
            33% { background-position: 50% 100%; }
            66% { background-position: 100% 50%; }
        }

        .digit.changing {
            transform: translateY(-15px) scale(0.9);
            opacity: 0;
            filter: blur(5px);
        }

        .separator {
            display: inline-block;
            animation: separatorPulse 2s ease-in-out infinite;
            background: linear-gradient(180deg, #a78bfa 0%, #8b5cf6 25%, #6366f1 50%, #3b82f6 75%, #0ea5e9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 100% 200%;
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.9));
            position: relative;
            margin: 0 0.05em;
        }

        @keyframes separatorPulse {
            0%, 100% { 
                opacity: 1;
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.9));
                background-position: 0% 0%;
            }
            50% { 
                opacity: 0.35;
                transform: scale(0.9);
                filter: drop-shadow(0 0 35px rgba(59, 130, 246, 1));
                background-position: 0% 100%;
            }
        }

        .fullscreen-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25) 0%, rgba(59, 130, 246, 0.2) 100%);
            border: 2px solid rgba(139, 92, 246, 0.5);
            border-radius: 50px;
            padding: 12px 24px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
        }

        .fullscreen-btn:hover {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.4) 0%, rgba(59, 130, 246, 0.35) 100%);
            border-color: rgba(139, 92, 246, 0.7);
            color: rgba(255, 255, 255, 1);
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
        }

        .fullscreen-btn:active {
            transform: translateX(-50%) translateY(0);
        }

        .icon {
            width: 16px;
            height: 16px;
            display: inline-block;
        }

        .wake-lock-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.9),
                        0 0 30px rgba(16, 185, 129, 0.5);
            transition: all 0.3s ease;
            z-index: 10;
            animation: indicatorPulse 3s ease-in-out infinite;
        }

        @keyframes indicatorPulse {
            0%, 100% { 
                box-shadow: 0 0 15px rgba(16, 185, 129, 0.9),
                            0 0 30px rgba(16, 185, 129, 0.5);
            }
            50% { 
                box-shadow: 0 0 20px rgba(16, 185, 129, 1),
                            0 0 40px rgba(16, 185, 129, 0.7);
            }
        }

        .wake-lock-indicator.inactive {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6),
                        0 0 20px rgba(239, 68, 68, 0.4);
            animation: none;
        }

        @media (max-width: 768px) {
            .fullscreen-btn {
                padding: 10px 20px;
                font-size: 0.85rem;
                bottom: 15px;
            }
        }

        @media (max-width: 480px) {
            .time-container {
                gap: 0.1em;
            }
            
            .fullscreen-btn {
                padding: 8px 16px;
                font-size: 0.8rem;
                bottom: 10px;
            }

            .wake-lock-indicator {
                top: 15px;
                right: 15px;
                width: 10px;
                height: 10px;
            }
        }

        /* Fade in animation on load */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="wake-lock-indicator" id="wakeLockIndicator" role="status" aria-label="Screen Wake Lock Status: Initializing" title="Screen Wake Lock Status"></div>
    
    <div class="time-container" id="timeDisplay">
        <span class="digit" id="hour1">0</span>
        <span class="digit" id="hour2">0</span>
        <span class="separator">:</span>
        <span class="digit" id="minute1">0</span>
        <span class="digit" id="minute2">0</span>
    </div>

    <button class="fullscreen-btn" id="fullscreenBtn" aria-label="Enter Fullscreen mode">
        <span class="icon" id="fullscreenIcon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
        </span>
        <span id="fullscreenText">Fullscreen</span>
    </button>

    <script>
        // Wake Lock
        let wakeLock = null;
        const wakeLockIndicator = document.getElementById('wakeLockIndicator');

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLockIndicator.classList.remove('inactive');
                    wakeLockIndicator.title = 'Screen Wake Lock: Active';
                    wakeLockIndicator.setAttribute('aria-label', 'Screen Wake Lock Status: Active');
                    
                    wakeLock.addEventListener('release', () => {
                        wakeLockIndicator.classList.add('inactive');
                        wakeLockIndicator.title = 'Screen Wake Lock: Inactive';
                        wakeLockIndicator.setAttribute('aria-label', 'Screen Wake Lock Status: Inactive');
                    });
                } else {
                    wakeLockIndicator.classList.add('inactive');
                    wakeLockIndicator.title = 'Wake Lock API not supported';
                    wakeLockIndicator.setAttribute('aria-label', 'Screen Wake Lock Status: Not supported');
                }
            } catch (err) {
                console.error('Wake Lock request failed:', err);
                wakeLockIndicator.classList.add('inactive');
                wakeLockIndicator.title = 'Wake Lock: Failed to activate';
                wakeLockIndicator.setAttribute('aria-label', 'Screen Wake Lock Status: Failed to activate');
            }
        }

        // Re-request wake lock when page becomes visible
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        // Initial wake lock request
        requestWakeLock();

        // Time Display
        const DIGIT_TRANSITION_DURATION = 250; // milliseconds
        const digits = {
            hour1: document.getElementById('hour1'),
            hour2: document.getElementById('hour2'),
            minute1: document.getElementById('minute1'),
            minute2: document.getElementById('minute2')
        };
        const digitTimeouts = {}; // Store timeout IDs for cleanup

        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            updateDigit('hour1', hours[0]);
            updateDigit('hour2', hours[1]);
            updateDigit('minute1', minutes[0]);
            updateDigit('minute2', minutes[1]);
        }

        function updateDigit(id, newValue) {
            const element = digits[id];
            const currentValue = element.textContent;
            
            if (currentValue !== newValue) {
                // Clear any existing timeout for this digit
                if (digitTimeouts[id]) {
                    clearTimeout(digitTimeouts[id]);
                }
                
                element.classList.add('changing');
                
                digitTimeouts[id] = setTimeout(() => {
                    element.textContent = newValue;
                    element.classList.remove('changing');
                    digitTimeouts[id] = null;
                }, DIGIT_TRANSITION_DURATION);
            }
        }

        // Update time immediately and then every second
        updateTime();
        setInterval(updateTime, 1000);

        // Fullscreen functionality
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenText = document.getElementById('fullscreenText');
        const fullscreenIcon = document.getElementById('fullscreenIcon');

        function updateFullscreenButton() {
            if (document.fullscreenElement) {
                fullscreenText.textContent = 'Exit Fullscreen';
                fullscreenBtn.setAttribute('aria-label', 'Exit Fullscreen mode');
                fullscreenIcon.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
                    </svg>
                `;
            } else {
                fullscreenText.textContent = 'Fullscreen';
                fullscreenBtn.setAttribute('aria-label', 'Enter Fullscreen mode');
                fullscreenIcon.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                `;
            }
        }

        async function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (err) {
                console.error('Fullscreen toggle failed:', err);
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', updateFullscreenButton);
    </script>
</body>
</html>
